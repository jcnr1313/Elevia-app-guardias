name: Generar APK con EAS Local

on:
  push:
    branches:
      - main # Cambia a 'master' si tu rama principal se llama así
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK con EAS Local
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código
      - name: ⬇️ Descargar repositorio
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: 🏗️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      # 3. Configurar Java (Imprescindible para que no falle el plugin de EAS local)
      - name: ☕ Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. Instalar la herramienta de Expo y EAS
      - name: 🚀 Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # 5. Instalar las dependencias de tu App
      - name: 📦 Instalar dependencias JS
        run: npm install

      # 6. Ejecutar la instrucción que genera el enlace y el QR sin que pida emulador
      - name: 🤖 Compilar APK
        run: eas build --platform android --profile preview --local --non-interactive