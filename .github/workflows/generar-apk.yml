name: Generar APK Android Nativo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Descargar repositorio
        uses: actions/checkout@v4

      - name: 🏗️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: 📦 Instalar dependencias JS
        run: npm install

      - name: ☕ Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🔑 Dar permisos a Gradle
        run: chmod +x android/gradlew

      - name: 🤖 Compilar APK Nativo
        run: |
          cd android
          ./gradlew assembleDebug

      - name: 📦 Guardar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7